version: '3.8'

services:
  backend-blue:
    build:
      context: .
      dockerfile: Dockerfile
    image: backend:blue
    container_name: backend-blue
    ports:
      - "3005:3005"
    env_file:
      - .env
    networks:
      - app-network
    restart: always
    environment:
      - TZ=Asia/Kolkata
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3005/test"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  app-network:
    external: true   # 👈 reuse same network created by green