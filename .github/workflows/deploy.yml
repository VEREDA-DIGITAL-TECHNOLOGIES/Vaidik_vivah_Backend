name: Deploy Backend to VPS

on:
  push:
    branches:
      - Main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > key.pem
          chmod 600 key.pem

      - name: Deploy to VPS
        run: |
          ssh -i key.pem -o StrictHostKeyChecking=no root@31.97.60.154 << 'EOF'
            set -e

            cd ~/Vaidik_vivah_Backend

            git fetch origin
            git reset --hard origin/Main
            git clean -fd

            # Ensure network exists
            docker network create vaidik_vivah_backend_app-network || true

            # Detect active container
            if docker ps --format "{{.Names}}" | grep -q "backend-green"; then
              CURRENT_COLOR="green"
              NEW_COLOR="blue"
              NEW_PORT=3005
            else
              CURRENT_COLOR="blue"
              NEW_COLOR="green"
              NEW_PORT=3006
            fi

            echo "Deploying $NEW_COLOR on port $NEW_PORT"

            # ✅ USE COMPOSE V2
            docker compose -f docker-compose.$NEW_COLOR.yml build --build-arg CACHEBUST=$(date +%s)
            docker compose -f docker-compose.$NEW_COLOR.yml up -d

            # Ensure container exists
            if ! docker inspect backend-$NEW_COLOR > /dev/null 2>&1; then
              echo "Container not created"
              docker ps -a
              exit 1
            fi

            # Wait for health
            MAX_RETRIES=30
            COUNT=0

            until [ "$(docker inspect --format='{{.State.Health.Status}}' backend-$NEW_COLOR)" = "healthy" ]; do
              sleep 5
              COUNT=$((COUNT+1))
              if [ $COUNT -ge $MAX_RETRIES ]; then
                echo "Health check failed"
                exit 1
              fi
            done

            echo "New container healthy"

            # Switch Nginx
            sed -i -E "s/localhost:[0-9]+/localhost:$NEW_PORT/g" /etc/nginx/sites-available/backend.vedvivah.in.conf
            nginx -t && systemctl reload nginx

            # Stop old
            docker stop backend-$CURRENT_COLOR || true
            docker rm backend-$CURRENT_COLOR || true
            docker rmi backend:$CURRENT_COLOR || true

            # Clean safely (no redis/postgres delete)
            docker image prune -f || true
            docker container prune -f || true

            echo "Deployment done → $NEW_COLOR active"
          EOF