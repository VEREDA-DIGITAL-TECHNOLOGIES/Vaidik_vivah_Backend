name: Deploy Backend to VPS

on:
  push:
    branches:
      - Main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > key.pem
          chmod 600 key.pem

      - name: Deploy to VPS
        run: |
          ssh -i key.pem -o StrictHostKeyChecking=no root@31.97.60.154 << 'EOF'
            set -e

            echo "Changing to project directory"
            cd ~/Vaidik_vivah_Backend

            echo "Pulling latest code"
            git fetch origin
            git reset --hard origin/Main
            git clean -fd

            echo "Ensuring Docker network exists"
            docker network create vaidik_vivah_backend_app-network || true

            echo "Detecting active container"
            if docker ps --format "{{.Names}}" | grep -q "backend-green"; then
              CURRENT_COLOR="green"
              NEW_COLOR="blue"
              NEW_PORT=3005
            else
              CURRENT_COLOR="blue"
              NEW_COLOR="green"
              NEW_PORT=3006
            fi

            echo "Current: $CURRENT_COLOR → New: $NEW_COLOR"

            echo "Building new container"
            docker compose -f docker-compose.$NEW_COLOR.yml build --build-arg CACHEBUST=$(date +%s)

            echo "Removing existing $NEW_COLOR container if any (FIX)"
            docker rm -f backend-$NEW_COLOR 2>/dev/null || true

            echo "Starting new container"
            docker compose -f docker-compose.$NEW_COLOR.yml up -d

            echo "Checking container exists"
            if ! docker inspect backend-$NEW_COLOR > /dev/null 2>&1; then
              echo "Container not created"
              docker ps -a
              exit 1
            fi

            echo "Waiting for health check"
            MAX_RETRIES=30
            COUNT=0

            until [ "$(docker inspect --format='{{.State.Health.Status}}' backend-$NEW_COLOR)" = "healthy" ]; do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' backend-$NEW_COLOR)
              echo "Health: $STATUS"
              sleep 5
              COUNT=$((COUNT+1))

              if [ $COUNT -ge $MAX_RETRIES ]; then
                echo "Health check failed"
                exit 1
              fi
            done

            echo "New container is healthy"

            echo "Switching Nginx"
            sed -i -E "s/localhost:[0-9]+/localhost:$NEW_PORT/g" /etc/nginx/sites-available/backend.vedvivah.in.conf
            nginx -t && systemctl reload nginx

            echo "Stopping old container"
            docker stop backend-$CURRENT_COLOR || true
            docker rm backend-$CURRENT_COLOR || true
            docker rmi backend:$CURRENT_COLOR || true

            echo "Cleaning unused Docker resources"
            docker image prune -f || true
            docker container prune -f || true

            echo "Deployment successful → $NEW_COLOR active"
          EOF