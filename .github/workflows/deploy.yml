name: Deploy Backend to VPS

on:
  push:
    branches:
      - Main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > key.pem
          chmod 600 key.pem

      - name: Deploy (clean logs)
        run: |
          ssh -i key.pem \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=60 \
            -o ServerAliveCountMax=10 \
            root@31.97.60.154 << 'EOF'

            set -e   # ❌ removed -x (less spam)

            cd ~/Vaidik_vivah_Backend

            echo "=== PULL ==="
            git fetch origin
            git reset --hard origin/Main
            git clean -fd

            echo "=== NETWORK ==="
            docker network create vaidik_vivah_backend_app-network || true

            echo "=== CLEAN OLD ==="
            docker rm -f backend-green 2>/dev/null || true

            echo "=== BUILD ==="
            docker-compose -f docker-compose.green.yml build --no-cache

            echo "=== START ==="
            docker-compose -f docker-compose.green.yml up -d

            echo "=== WAIT ==="
            sleep 5

            echo "=== LAST 100 LOGS (NOT STREAM) ==="
            docker logs backend-green --tail 100

            echo "=== HEALTH CHECK ==="
            for i in {1..20}; do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' backend-green)
              echo "Health: $STATUS"
              [ "$STATUS" = "healthy" ] && break
              sleep 3
            done

            echo "=== FINAL ==="
            docker ps

            echo "=== DONE ==="
          EOF