name: Deploy Backend to VPS

on:
  push:
    branches:
      - Main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > key.pem
          chmod 600 key.pem

      - name: Deploy to VPS (stable)
        run: |
          ssh -tt -i key.pem -o StrictHostKeyChecking=no root@31.97.60.154 << 'EOF'
            set -e

            echo "Changing to project directory"
            cd ~/Vaidik_vivah_Backend

            echo "Pulling latest code"
            git fetch origin
            git reset --hard origin/Main
            git clean -fd

            echo "Ensuring Docker network exists"
            docker network create vaidik_vivah_backend_app-network || true

            echo "Detecting active container"
            if docker ps --format "{{.Names}}" | grep -q "backend-green"; then
              CURRENT_COLOR="green"
              NEW_COLOR="blue"
              NEW_PORT=3005
            else
              CURRENT_COLOR="blue"
              NEW_COLOR="green"
              NEW_PORT=3006
            fi

            echo "Current: $CURRENT_COLOR"
            echo "Deploying: $NEW_COLOR (port $NEW_PORT)"

            echo "Building Docker image"
            docker-compose -f docker-compose.$NEW_COLOR.yml build --build-arg CACHEBUST=$(date +%s)

            echo "Starting new container"
            docker-compose -f docker-compose.$NEW_COLOR.yml up -d

            echo "Waiting for container startup"
            sleep 5

            echo "Showing recent logs"
            docker logs backend-$NEW_COLOR --tail 100

            echo "Waiting for health check"
            MAX_RETRIES=30
            COUNT=0

            until [ "$(docker inspect --format='{{.State.Health.Status}}' backend-$NEW_COLOR)" = "healthy" ]; do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' backend-$NEW_COLOR)
              echo "Health: $STATUS"

              sleep 5
              COUNT=$((COUNT+1))

              if [ $COUNT -ge $MAX_RETRIES ]; then
                echo "ERROR: Health check timeout"
                exit 1
              fi
            done

            

            

            echo "Deployment successful "
          EOF