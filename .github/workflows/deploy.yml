name: Deploy Backend to VPS

on:
  push:
    branches:
      - Main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > key.pem
          chmod 600 key.pem

      - name: Deploy (with real error logs)
        run: |
          ssh -tt -i key.pem -o StrictHostKeyChecking=no root@31.97.60.154 << 'EOF'
            set -ex   # ✅ VERY IMPORTANT (shows failing line)

            cd ~/Vaidik_vivah_Backend

            echo "=== PULL ==="
            git fetch origin
            git reset --hard origin/Main
            git clean -fd

            echo "=== NETWORK ==="
            docker network create vaidik_vivah_backend_app-network || true

            echo "=== DETECT COLOR ==="
            if docker ps --format "{{.Names}}" | grep -q "backend-green"; then
              CURRENT_COLOR="green"
              NEW_COLOR="blue"
            else
              CURRENT_COLOR="blue"
              NEW_COLOR="green"
            fi

            echo "Deploying $NEW_COLOR"

            echo "=== FORCE REMOVE OLD SAME COLOR (FIX BUG) ==="
            docker rm -f backend-$NEW_COLOR 2>/dev/null || true

            echo "=== BUILD ==="
            docker-compose -f docker-compose.$NEW_COLOR.yml build --no-cache

            echo "=== START ==="
            docker-compose -f docker-compose.$NEW_COLOR.yml up -d

            echo "=== WAIT ==="
            sleep 5

            echo "=== CHECK CONTAINER EXISTS ==="
            docker ps -a

            echo "=== LOGS (IMPORTANT) ==="
            docker logs backend-$NEW_COLOR --tail 100 || true

            echo "=== HEALTH CHECK ==="
            for i in {1..20}; do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' backend-$NEW_COLOR)
              echo "Health: $STATUS"
              [ "$STATUS" = "healthy" ] && break
              sleep 3
            done

            echo "=== DONE ==="
          EOF