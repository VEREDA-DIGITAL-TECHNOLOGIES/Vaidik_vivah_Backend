name: Deploy Backend to VPS

on:
  push:
    branches:
      - Main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > key.pem
          chmod 600 key.pem

      - name: Deploy to VPS
        run: |
          ssh -i key.pem -o StrictHostKeyChecking=no root@31.97.60.154 << 'EOF'
            set -e

            echo "Changing to project directory"
            cd ~/Vaidik_vivah_Backend

            echo "Pulling latest code"
            git fetch origin
            git reset --hard origin/Main
            git clean -fd

            echo "Ensuring Docker network exists"
            docker network create vaidik_vivah_backend_app-network || true

            echo "Detecting active container"
            if docker ps --format "{{.Names}}" | grep -q "backend-green"; then
              CURRENT_COLOR="green"
              NEW_COLOR="blue"
              NEW_PORT=3005
            else
              CURRENT_COLOR="blue"
              NEW_COLOR="green"
              NEW_PORT=3006
            fi

            echo "Current deployment: $CURRENT_COLOR"
            echo "Deploying new version: $NEW_COLOR on port $NEW_PORT"

            docker-compose -f docker-compose.$NEW_COLOR.yml build --build-arg CACHEBUST=$(date +%s)
            docker-compose -f docker-compose.$NEW_COLOR.yml up -d

            echo "Waiting for container initialization"
            sleep 5

            if ! docker inspect backend-$NEW_COLOR > /dev/null 2>&1; then
              echo "Error: container backend-$NEW_COLOR was not created"
              docker ps -a
              exit 1
            fi

            echo "Waiting for health check"
            MAX_RETRIES=30
            COUNT=0

            until [ "$(docker inspect --format='{{.State.Health.Status}}' backend-$NEW_COLOR)" = "healthy" ]; do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' backend-$NEW_COLOR)
              echo "Current health status: $STATUS"

              sleep 5
              COUNT=$((COUNT+1))

              if [ $COUNT -ge $MAX_RETRIES ]; then
                echo "Error: health check timeout"
                exit 1
              fi
            done

            echo "New container is healthy"

            echo "Updating Nginx configuration"
            cp /etc/nginx/sites-available/backend.vedvivah.in.conf /etc/nginx/sites-available/backend.vedvivah.in.conf.bak

            sed -i -E "s/localhost:[0-9]+/localhost:$NEW_PORT/g" /etc/nginx/sites-available/backend.vedvivah.in.conf

            nginx -t && systemctl reload nginx

            echo "Stopping old container"
            docker stop backend-$CURRENT_COLOR || true
            docker rm backend-$CURRENT_COLOR || true

            echo "Removing old image"
            docker rmi backend:$CURRENT_COLOR || true

            echo "Cleaning unused Docker resources (safe)"
            docker image prune -f || true
            docker container prune -f || true

            echo "Deployment completed successfully. Active version: $NEW_COLOR"
          EOF