name: Deploy Backend to VPS

on:
  push:
    branches:
      - Main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > key.pem
          chmod 600 key.pem

      - name: Deploy (fast + filtered logs)
        run: |
          ssh -i key.pem \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=60 \
            -o ServerAliveCountMax=10 \
            root@31.97.60.154 << 'EOF'

            set -e

            cd ~/Vaidik_vivah_Backend

            echo "=== PULL ==="
            git fetch origin
            git reset --hard origin/Main
            git clean -fd

            echo "=== NETWORK ==="
            docker network create vaidik_vivah_backend_app-network || true

            echo "=== CLEAN OLD ==="
            docker rm -f backend-green 2>/dev/null || true

            echo "=== BUILD (SHOW PROGRESS) ==="
            docker-compose -f docker-compose.green.yml build --progress=plain

            echo "=== START ==="
            docker-compose -f docker-compose.green.yml up -d

            echo "=== SHOW IMPORTANT LOGS (LIVE BUT LIMITED) ==="

            for i in {1..10}; do
              docker logs backend-green --tail 50 2>&1 | \
              grep -E "Server running|Redis|Database|ERROR|Error|Connected" | \
              tail -n 20
              sleep 2
            done

            echo "=== HEALTH CHECK ==="
            for i in {1..15}; do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' backend-green)
              echo "Health: $STATUS"
              [ "$STATUS" = "healthy" ] && break
              sleep 2
            done

            echo "=== FINAL ==="
            docker ps

            echo "=== DONE ==="
          EOF