name: Deploy Backend to VPS

on:
  push:
    branches:
      - Main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > key.pem
          chmod 600 key.pem

      - name: Deploy to VPS (simple + logs)
        run: |
          ssh -tt -i key.pem -o StrictHostKeyChecking=no root@31.97.60.154 << EOF
            set -ex   # ✅ show commands + stop on error

            cd ~/Vaidik_vivah_Backend

            echo "=== PULL LATEST CODE ==="
            git fetch origin
            git reset --hard origin/Main
            git clean -fd

            echo "=== CREATE NETWORK (if not exists) ==="
            docker network create vaidik_vivah_backend_app-network || true

            echo "=== STOP OLD CONTAINERS ==="
            docker rm -f backend-blue 2>/dev/null || true
            docker rm -f backend-green 2>/dev/null || true

            echo "=== BUILD & START (GREEN ONLY) ==="
            docker compose -f docker-compose.green.yml build --no-cache
            docker compose -f docker-compose.green.yml up -d

            echo "=== SHOW RUNNING CONTAINERS ==="
            docker ps

            echo "=== SHOW LOGS (IMPORTANT) ==="
            docker logs backend-green --tail 100

            echo "=== DONE ==="
          EOF