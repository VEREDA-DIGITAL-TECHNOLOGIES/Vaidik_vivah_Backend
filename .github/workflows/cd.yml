name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed

jobs:
  deploy:
    runs-on: self-hosted

    steps:
    - name: Log in to Docker Hub
      run: |
        echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Pull Docker Image
      run: |
        echo "Pulling latest Docker image..."
        docker pull developermanishk/wedlock-backend:latest

    - name: Stop and Remove Old Docker Container
      run: |
        echo "Stopping and removing old container if exists..."
        docker ps -a -q --filter "name=wedlock-backend" | grep -q . && docker stop wedlock-backend && docker rm -f wedlock-backend || echo "No container to remove."

    - name: Run New Docker Container
      run: |
        echo "Running new container..."
        docker run -d -p 80:3005 \
          --name wedlock-backend \
          --restart unless-stopped \
          --env-file /home/ubuntu/.env \
          developermanishk/wedlock-backend:latest

    - name: Check Running Containers
      run: |
        echo "Current running containers:"
        docker ps
