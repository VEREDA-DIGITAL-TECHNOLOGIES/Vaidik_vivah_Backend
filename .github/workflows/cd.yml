name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed

jobs:
  deploy:
    runs-on: self-hosted

    steps:
    - name: Pull Docker Image
      run: docker pull developermanishk/wedlock-backend:latest

    - name: Delete Old Docker Container
      run: sudo docker rm -f wedlock-backend || true

    - name: Run Docker Container
      run: |
        sudo docker run -d -p 3005:3005 \
          --name wedlock-backend \
          --restart unless-stopped \
          developermanishk/wedlock-backend:latest
