name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
 
jobs:
  deploy:
    runs-on: self-hosted

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker (if needed)
      run: echo "No login needed for local build"

    - name: Build Docker Image
      run: |
        echo "Building Docker image..."
        docker build -t vaidikvivah-backend:latest .

    - name: Stop and Remove Old Container
      run: |
        echo "Stopping and removing old container..."
        docker ps -a -q --filter "name=vaidikvivah-backend" | grep -q . \
          && docker stop vaidikvivah-backend && docker rm -f vaidikvivah-backend \
          || echo "No old container to remove."

    - name: Run New Container
      run: |
        echo "Running new container..."
        docker run -d \
          -p 80:3005 \
          --name vaidikvivah-backend \
          --restart unless-stopped \
          --env-file /home/ubuntu/.env \
          vaidikvivah-backend:latest

    - name: Show Running Containers
      run: docker ps
